<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <div class="container mt-5">
        <h1 class="text-center">Kalkulator</h1>
        <p class="text-center">Ini adalah halaman kalkulator</p>
        <label for="angka1">Angka 1:</label>
        <input type="number" id="angka1" class="form-control mb-3" placeholder="Masukkan angka pertama">
        <label for="operator">Operator:</label>
        <select id="operator" class="form-control mb-3">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <label for="angka2">Angka 2:</label>
        <input type="number" id="angka2" class="form-control mb-3" placeholder="Masukkan angka kedua">
        <button id="hitungButton" class="btn btn-primary">Hitung</button>
        <p id="hasil" class="mt-3"></p>
    </div>

    <script src="pertambahan.js"></script>
</body>
</html>
